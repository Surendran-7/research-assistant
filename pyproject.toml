[project]
name = "research-assistant"
version = "0.1.0"
description = "Multi-agent research assistant: RAG + web/wikipedia tools + visualization, powered by Groq"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "duckduckgo-search>=6.2.0",
    "wikipedia>=1.4.0",
    "matplotlib>=3.9.0",
    "networkx>=3.3",
    "rich>=13.7.0",
    "streamlit>=1.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
